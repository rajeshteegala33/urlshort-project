<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>URL Shortener</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    input, button { padding: 8px; margin: 4px; }
    .container { max-width: 800px; }
    .card { border: 1px solid #ddd; padding: 16px; margin-bottom: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>URL Shortener with Analytics</h1>

    <div class="card" id="auth-card">
      <h3>Sign up / Login</h3>
      <input id="username" placeholder="username" />
      <input id="password" placeholder="password" type="password" />
      <button onclick="signup()">Sign up</button>
      <button onclick="login()">Login</button>
      <div id="auth-result"></div>
    </div>

    <div class="card" id="shorten-card" style="display:none;">
      <h3>Create Short Link</h3>
      <input id="original" placeholder="https://example.com/long-url" style="width:70%;" />
      <input id="custom" placeholder="custom short (optional)" />
      <button onclick="shorten()">Create</button>
      <div id="short-result"></div>
    </div>

    <div class="card" id="analytics-card" style="display:none;">
      <h3>View Analytics</h3>
      <input id="short-to-view" placeholder="short code" />
      <button onclick="viewAnalytics()">View</button>
      <pre id="analytics-result"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
